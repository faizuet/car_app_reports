services:
  web:
    build: .
    container_name: car_web
    env_file: .env
    environment:
      ENV: docker
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    command: sh -c "sed -i 's/\r$$//' /app/scripts/*.sh 2>/dev/null; alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: .
    container_name: car_worker
    env_file: .env
    environment:
      ENV: docker
    command: sh -c "sed -i 's/\r$$//' /app/scripts/*.sh 2>/dev/null; /app/scripts/celery_app.sh"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  beat:
    build: .
    container_name: car_beat
    env_file: .env
    environment:
      ENV: docker
    command: sh -c "sed -i 's/\\r$$//' /app/scripts/*.sh 2>/dev/null; /app/scripts/celery_beat.sh"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  db:
    image: postgres:16-alpine
    container_name: car_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AppPass123}
      POSTGRES_DB: ${POSTGRES_DB:-car_app_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-car_app_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: car_redis
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5
    container_name: car_neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-Neo4j_1234}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - backend

  frontend:
    image: node:20-alpine
    container_name: car_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  frontend_node_modules:
  uploads_data:

networks:
  backend:
    driver: bridge
